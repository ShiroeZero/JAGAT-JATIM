name: Collect and Deploy PNM

on:
  workflow_dispatch:

  schedule:
    # Jalan setiap 1 jam
    - cron: "17 * * * *"


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:

  collect:

    runs-on: ubuntu-latest


    environment:
      name: github-pages


    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =====================================================
      # 3. COLLECT NEWS
      # =====================================================

      - name: Collect and classify news
        run: |
          python scripts/fetch_news.py


      # =====================================================
      # 4. BUILD CASE CLUSTERS
      # =====================================================

      - name: Build case clusters
        run: |
          python scripts/process_cases.py


      # =====================================================
      # 5. PREPARE SOCIAL MONITORING
      # =====================================================

      - name: Prepare social monitoring
        run: |
          python scripts/fetch_social.py


      # =====================================================
      # 6. SAVE DATA TO GITHUB
      # =====================================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/news.json \
            data/cases.json \
            data/social.json


          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi


      # =====================================================
      # 7. UPLOAD GITHUB PAGES
      # =====================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: "."


      # =====================================================
      # 8. DEPLOY GITHUB PAGES
      # =====================================================

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
