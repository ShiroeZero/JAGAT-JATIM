name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: "pnm-collector"
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 1. COLLECT NEWS
      # ==========================================

      - name: Collect news
        run: |
          python -u scripts/fetch_news.py

      # ==========================================
      # 2. BUILD CASE CLUSTERS
      # ==========================================

      - name: Build case clusters
        run: |
          python -u scripts/process_cases.py

      # ==========================================
      # 3. COLLECT YOUTUBE
      # ==========================================

      - name: Collect YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -u scripts/fetch_social.py

      # ==========================================
      # 4. CHECK GENERATED DATA
      # ==========================================

      - name: Check monitoring data
        run: |

          echo "========================================"
          echo "CHECK MONITORING DATA"
          echo "========================================"

          echo ""
          echo "news.json:"
          if [ -f data/news.json ]; then
            ls -lh data/news.json
          else
            echo "WARNING: data/news.json tidak ditemukan"
          fi

          echo ""
          echo "cases.json:"
          if [ -f data/cases.json ]; then
            ls -lh data/cases.json
          else
            echo "WARNING: data/cases.json tidak ditemukan"
          fi

          echo ""
          echo "social.json:"
          if [ -f data/social.json ]; then
            ls -lh data/social.json
          else
            echo "WARNING: data/social.json tidak ditemukan"
          fi

          echo ""
          echo "========================================"

      # ==========================================
      # 5. SAVE DATA
      # ==========================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/news.json \
            data/cases.json \
            data/social.json

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi
