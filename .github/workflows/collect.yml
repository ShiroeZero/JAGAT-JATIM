name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: "pnm-collector"
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. COLLECT NEWS
      # ==========================================

      - name: Collect news
        run: |
          python -u scripts/fetch_news.py


      # ==========================================
      # 4. CHECK NEWS
      # ==========================================

      - name: Check news after fetch
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/news.json"

          if not os.path.exists(path):
              print("ERROR: data/news.json tidak ditemukan")
              raise SystemExit(1)

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items", [])

          print("========================================")
          print("NEWS DATABASE CHECK")
          print(f"News records : {len(items)}")
          print("========================================")
          PY


      # ==========================================
      # 5. BUILD CASE CLUSTERS
      # ==========================================

      - name: Build case clusters
        run: |
          python -u scripts/process_cases.py


      # ==========================================
      # 6. CHECK CASE DATABASE
      # ==========================================

      - name: Check case database
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/case_clusters.json"

          if not os.path.exists(path):
              print("ERROR: case_clusters.json tidak ditemukan")
              raise SystemExit(1)

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          cases = data.get("cases", [])

          print("========================================")
          print("CASE DATABASE CHECK")
          print(f"Cases    : {len(cases)}")
          print(f"Articles : {data.get('total_articles', 0)}")
          print("========================================")
          PY


      # ==========================================
      # 7. COLLECT YOUTUBE
      # ==========================================

      - name: Collect YouTube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -u scripts/fetch_social.py


      # ==========================================
      # 8. CHECK YOUTUBE
      # ==========================================

      - name: Check YouTube data
        run: |

          echo "========================================"
          echo "YOUTUBE DATA CHECK"
          echo "========================================"

          if [ -f data/social.json ]; then
            ls -lh data/social.json
            echo "YouTube data tersedia."
          else
            echo "WARNING: data/social.json tidak tersedia."
            echo "Workflow tetap dilanjutkan."
          fi

          echo "========================================"


      # ==========================================
      # 9. CREATE DAILY SNAPSHOT
      # ==========================================

      - name: Create daily snapshot
        run: |
          python -u scripts/create_daily_snapshot.py


      # ==========================================
      # 10. BUILD ARCHIVE INDEX
      # ==========================================

      - name: Build archive index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archive_dir = Path("data/archive")

          archive_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          files = sorted(
              [
                  p.stem
                  for p in archive_dir.glob("*.json")
                  if p.name != "index.json"
              ],
              reverse=True
          )

          output = {
              "files": files
          }

          with open(
              archive_dir / "index.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========================================")
          print("ARCHIVE INDEX")
          print("========================================")
          print(f"Archives : {len(files)}")

          for item in files[:10]:
              print(f" - {item}")

          print("")
          print("Output   : data/archive/index.json")
          print("========================================")
          PY


      # ==========================================
      # 11. CHECK MONITORING DATA
      # ==========================================

      - name: Check monitoring data
        run: |

          echo "========================================"
          echo "CHECK MONITORING DATA"
          echo "========================================"

          echo ""
          echo "news.json:"
          if [ -f data/news.json ]; then
            ls -lh data/news.json
          else
            echo "WARNING: data/news.json tidak ditemukan"
          fi

          echo ""
          echo "case_clusters.json:"
          if [ -f data/case_clusters.json ]; then
            ls -lh data/case_clusters.json
          else
            echo "WARNING: data/case_clusters.json tidak ditemukan"
          fi

          echo ""
          echo "social.json:"
          if [ -f data/social.json ]; then
            ls -lh data/social.json
          else
            echo "WARNING: data/social.json tidak ditemukan"
          fi

          echo ""
          echo "today.json:"
          if [ -f data/today.json ]; then
            ls -lh data/today.json
          else
            echo "WARNING: data/today.json tidak ditemukan"
          fi

          echo ""
          echo "archive/index.json:"
          if [ -f data/archive/index.json ]; then
            ls -lh data/archive/index.json
          else
            echo "WARNING: data/archive/index.json tidak ditemukan"
          fi

          echo ""
          echo "archive:"
          if [ -d data/archive ]; then
            find data/archive \
              -maxdepth 1 \
              -type f \
              | sort
          else
            echo "WARNING: data/archive tidak ditemukan"
          fi

          echo ""
          echo "========================================"


      # ==========================================
      # 12. SAVE MONITORING DATA
      # ==========================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "GIT STATUS BEFORE COMMIT"
          echo "========================================"

          git status --short

          echo ""
          echo "========================================"
          echo "ADDING MONITORING DATA"
          echo "========================================"

          git add \
            data/news.json \
            data/case_clusters.json \
            data/social.json \
            data/today.json \
            data/archive/

          echo ""
          echo "========================================"
          echo "STAGED CHANGES"
          echo "========================================"

          git status --short

          if git diff --cached --quiet; then

            echo ""
            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi
