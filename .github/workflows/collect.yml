name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pnm-collector"
  cancel-in-progress: false

jobs:

  collect-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =====================================================
      # 2. PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # =====================================================
      # 3. COLLECT NEWS
      # =====================================================

      - name: Collect news
        run: |
          python -u scripts/fetch_news.py


      # =====================================================
      # 4. NORMALIZE LOCATION
      # =====================================================

      - name: Normalize location
        run: |
          python -u scripts/normalize_news.py


      # =====================================================
      # 5. CHECK NEWS
      # =====================================================

      - name: Check news database
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/news.json"

          if not os.path.exists(path):
              raise SystemExit(
                  "ERROR: data/news.json tidak ditemukan"
              )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items", [])

          print("========================================")
          print("NEWS DATABASE CHECK")
          print("========================================")
          print(f"News records : {len(items)}")
          print("========================================")
          PY


      # =====================================================
      # 6. BUILD CASE ENGINE
      # =====================================================

      - name: Build case clusters
        run: |
          python -u scripts/process_cases.py


      # =====================================================
      # 7. CHECK CASE DATABASE
      # =====================================================

      - name: Check case database
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/case_clusters.json"

          if not os.path.exists(path):
              raise SystemExit(
                  "ERROR: data/case_clusters.json tidak ditemukan"
              )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          cases = data.get("cases", [])

          total_articles = sum(
              int(case.get("article_count", 0) or 0)
              for case in cases
          )

          high_cases = sum(
              1
              for case in cases
              if str(
                  case.get("priority") or ""
              ).lower() == "high"
          )

          print("========================================")
          print("CASE DATABASE CHECK")
          print("========================================")
          print(f"Cases         : {len(cases)}")
          print(f"Articles      : {total_articles}")
          print(f"High priority : {high_cases}")
          print("========================================")
          PY


      # =====================================================
      # 8. COLLECT YOUTUBE
      # =====================================================

      - name: Collect YouTube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -u scripts/fetch_social.py


      # =====================================================
      # 9. CHECK YOUTUBE
      # =====================================================

      - name: Check YouTube data
        run: |

          echo "========================================"
          echo "YOUTUBE DATA CHECK"
          echo "========================================"

          if [ -f data/social.json ]; then
            ls -lh data/social.json
            echo "YouTube data tersedia."
          else
            echo "WARNING: data/social.json tidak tersedia."
          fi

          echo "========================================"


      # =====================================================
      # 10. CREATE DAILY SNAPSHOT
      # =====================================================

      - name: Create daily snapshot
        run: |
          python -u scripts/create_daily_snapshot.py


      # =====================================================
      # 11. BUILD ARCHIVE INDEX
      # =====================================================

      - name: Build archive index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archive_dir = Path("data/archive")

          archive_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          files = sorted(
              [
                  p.stem
                  for p in archive_dir.glob("*.json")
                  if p.name != "index.json"
              ],
              reverse=True
          )

          payload = {
              "files": files
          }

          with open(
              archive_dir / "index.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========================================")
          print("ARCHIVE INDEX")
          print("========================================")
          print(f"Archives : {len(files)}")

          for item in files[:10]:
              print(f" - {item}")

          print("Output   : data/archive/index.json")
          print("========================================")
          PY


      # =====================================================
      # 12. FINAL DATA VALIDATION
      # =====================================================

      - name: Validate final data
        run: |
          python -u scripts/validate_data.py


      # =====================================================
      # 13. CHECK MONITORING DATA
      # =====================================================

      - name: Check monitoring data
        run: |

          echo "========================================"
          echo "CHECK MONITORING DATA"
          echo "========================================"

          for f in \
            data/news.json \
            data/case_clusters.json \
            data/social.json \
            data/today.json \
            data/archive/index.json
          do

            if [ -f "$f" ]; then
              echo "$f:"
              ls -lh "$f"
            else
              echo "WARNING: $f tidak ditemukan"
            fi

            echo ""

          done

          echo "archive:"

          if [ -d data/archive ]; then
            find data/archive \
              -maxdepth 1 \
              -type f \
              | sort
          fi

          echo ""
          echo "========================================"


      # =====================================================
      # 14. SAVE DATA TO GIT
      # =====================================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short

          echo ""
          echo "========================================"
          echo "STAGING DATA"
          echo "========================================"

          git add \
            data/ \
            .github/workflows/collect.yml \
            scripts/ \
            app.js \
            index.html \
            styles.css \
            config.js \
            .gitignore \
            README.md

          echo ""
          echo "========================================"
          echo "STAGED CHANGES"
          echo "========================================"

          git status --short

          if git diff --cached --quiet; then

            echo ""
            echo "Tidak ada perubahan Git."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi


      # =====================================================
      # 15. CONFIGURE GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =====================================================
      # 16. PREPARE SITE
      #
      # Hanya file frontend + data yang dibutuhkan website.
      # =====================================================

      - name: Prepare Pages site
        run: |

          rm -rf site

          mkdir -p site

          cp index.html site/
          cp app.js site/
          cp styles.css site/
          cp config.js site/

          cp -r data site/data

          echo "========================================"
          echo "PAGES SITE"
          echo "========================================"

          find site \
            -maxdepth 2 \
            -type f \
            | sort

          echo "========================================"


      # =====================================================
      # 17. UPLOAD PAGES ARTIFACT
      # =====================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


      # =====================================================
      # 18. DEPLOY GITHUB PAGES
      # =====================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
