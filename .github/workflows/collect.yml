name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    # Berjalan setiap 1 jam
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: "collect-news"
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =====================================================
      # COLLECT NEWS
      # =====================================================

      - name: Collect and classify news
        run: |
          python scripts/fetch_news.py


      # =====================================================
      # BUILD CASE CLUSTERS
      # =====================================================

      - name: Build case clusters
        run: |
          python scripts/process_cases.py


      # =====================================================
      # PREPARE SOCIAL MONITORING
      # =====================================================

      - name: Prepare social monitoring
        run: |
          python scripts/fetch_social.py


      # =====================================================
      # SAVE DATA
      # =====================================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/news.json \
            data/cases.json \
            data/social.json


          if git diff --cached --quiet; then

            echo "========================================="
            echo "Tidak ada perubahan data."
            echo "========================================="

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi
