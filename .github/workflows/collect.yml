name: JAGAT — Pengumpulan & Pembaruan Data V6.7.0

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "jagat-collector"
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preflight engine tests
        run: |
          python -m py_compile scripts/*.py
          python scripts/test_location_engine.py
          python scripts/test_analysis_engine.py
      - name: Collect news
        run: python -u scripts/fetch_news.py
      - name: Normalize and classify data
        run: python -u scripts/normalize_news.py
      - name: Build case clusters
        run: python -u scripts/process_cases.py
      - name: Collect YouTube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -u scripts/fetch_social.py
      - name: Create daily snapshot
        run: python -u scripts/create_daily_snapshot.py
      - name: Build archive index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          archive_dir = Path("data/archive")
          archive_dir.mkdir(parents=True, exist_ok=True)
          files = sorted([p.stem for p in archive_dir.glob("*.json") if p.name != "index.json"], reverse=True)
          with open(archive_dir / "index.json", "w", encoding="utf-8") as f:
              json.dump({"files": files}, f, ensure_ascii=False, indent=2)
          PY
      - name: Validate final data
        run: python -u scripts/validate_data.py
      - name: Wire focused frontend
        run: python -u scripts/apply_frontend_ui.py
      - name: Check frontend assets
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f config.js
          test -f dashboard-modern.css
          test -f dashboard-modern.js
          node --check app.js
          node --check dashboard-modern.js
      - name: Remove generated Python cache
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name "*.pyc" -delete
      - name: Save monitoring data
        run: |
          git config user.name "JAGAT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/ assets/ .github/workflows/collect.yml index.html app.js styles.css config.js dashboard-modern.css dashboard-modern.js .gitignore README.md docs/
          if git diff --cached --quiet; then echo "Tidak ada perubahan Git."; else git commit -m "chore: update JAGAT v6.7.0 monitoring data"; git push; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html app.js styles.css config.js dashboard-modern.css dashboard-modern.js site/
          cp -r assets site/assets
          cp -r data site/data
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
