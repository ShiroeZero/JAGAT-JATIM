name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: "pnm-collector"
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 1. COLLECT NEWS
      # ==========================================

      - name: Collect news
        run: |
          python scripts/fetch_news.py

      # ==========================================
      # 2. BUILD CASES
      # ==========================================

      - name: Build case clusters
        run: |
          python scripts/process_cases.py

      # ==========================================
      # 3. PREPARE SOCIAL DATA
      # ==========================================

      - name: Prepare social monitoring
        run: |
          python scripts/fetch_social.py

      # ==========================================
      # 4. SAVE ALL DATA
      # ==========================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/news.json \
            data/cases.json \
            data/social.json

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi
