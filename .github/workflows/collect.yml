name: Collect Negative News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: "pnm-collector"
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 1. COLLECT NEWS
      # ==========================================

      - name: Check news after fetch
        run: |
          python - <<'PY'
          import json

          with open("data/news.json", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items", [])

          print("========================================")
          print("NEWS DATABASE CHECK")
          print(f"News records : {len(items)}")
          print("========================================")
          PY

      # ==========================================
      # 2. BUILD CASE CLUSTERS
      # ==========================================

      - name: Check case database
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/case_clusters.json"

          if not os.path.exists(path):
              print("ERROR: case_clusters.json tidak ditemukan")
              raise SystemExit(1)

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          cases = data.get("cases", [])

          print("========================================")
          print("CASE DATABASE CHECK")
          print(f"Cases    : {len(cases)}")
          print(f"Articles : {data.get('total_articles', 0)}")
          print("========================================")
          PY

      # ==========================================
      # 3. COLLECT YOUTUBE
      # ==========================================

      - name: Collect YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -u scripts/fetch_social.py

      # ==========================================
      # 4. CHECK GENERATED DATA
      # ==========================================

      - name: Check monitoring data
        run: |

          echo "========================================"
          echo "CHECK MONITORING DATA"
          echo "========================================"

          echo ""
          echo "news.json:"
          if [ -f data/news.json ]; then
            ls -lh data/news.json
          else
            echo "WARNING: data/news.json tidak ditemukan"
          fi

          echo ""
          echo "case_clusters.json:"
          if [ -f data/case_clusters.json ]; then
            ls -lh data/case_clusters.json
          else
            echo "WARNING: data/case_clusters.json tidak ditemukan"
          fi

          echo ""
          echo "social.json:"
          if [ -f data/social.json ]; then
            ls -lh data/social.json
          else
            echo "WARNING: data/social.json tidak ditemukan"
          fi

          echo ""
          echo "========================================"


      # ==========================================
      # 5. SAVE DATA
      # ==========================================

      - name: Save monitoring data
        run: |

          git config user.name "PNM Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "CHECK GIT CHANGES"
          echo "========================================"

          git status --short

          git add \
            data/news.json \
            data/case_clusters.json \
            data/social.json

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "chore: update monitoring data"

            git push

          fi
